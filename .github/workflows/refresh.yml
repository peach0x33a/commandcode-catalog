name: Refresh catalog

on:
  schedule:
    # Mondays 04:17 UTC. The generator is idempotent, so a run with no upstream
    # changes commits nothing.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Refresh catalog
        run: go run ./cmd/gen-allowances -out catalog.json

      - name: Commit changes
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore: refresh catalog"
          git push
